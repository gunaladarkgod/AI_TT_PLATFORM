server:
  port: ${SERVER_PORT:8081}
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  web:
    resources:
      static-locations: >
        file:${STATIC_ROOT:static}/,
        file:${MMDET_UPLOAD_ROOT:engines/mmdet_run/myfiles}/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_zm_master?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  data:
    redis:
      database: ${REDIS_DB:3}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-wait: 1000ms
  flyway:
    enabled: false
    clean-disabled: true
    mixed: true
    baseline-on-migrate: true
    baseline-version: 0
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false


knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
    swagger-model-name: 实体类
  
  basic:
    enable: false
    username: ${KNIFE4J_USERNAME:xgls}
    password: ${KNIFE4J_PASSWORD:12345}
sys:
  license: ${SYS_LICENSE:config/license.lic}
  jwt-key: ${SYS_JWT_KEY:xgls!123#hk}
  encode-src: false
  enable-token: true
  tensorboard:
    url: 6008
  cpu_server: ${CPU_SERVER_URL:http://127.0.0.1:8099/api/cpu}
  cvat:
    api-server: ${CVAT_API_' SERVER:http://localhost:8080}
#    api-username: api_user
#    api-password: Kiasdjfeb234d!
    api-username: ${CVAT_API_USERNAME:carlos}
    api-password: ${CVAT_API_PASSWORD:csc303}
  conda: ${CONDA_BIN:/home/omen1/miniconda3/condabin/conda}
  original-dataset-root: ${ORIGINAL_DATASET_ROOT:data/original_dataset}
  task-dataset-root: ${TASK_DATASET_ROOT:data/task_dataset}
  instance-dataset-mid-root: ${INSTANCE_DATASET_MID_ROOT:data/instance_dataset_mid}
  instance-dataset-root: ${INSTANCE_DATASET_ROOT:data/instance_dataset}
  root-logger: ${MMDET_LOG_ROOT:engines/mmdet_run/logs/}
  root-upload: ${MMDET_UPLOAD_ROOT:engines/mmdet_run/myfiles/}
  modelcfg:
    local-model-path:
      faster-rcnn:
        resnet: "engines/mmdet_run/myfiles/defaultModelConfig/CNN/faster_rcnn/faster_rcnn_resnet.py"
        convnext: "engines/mmdet_run/myfiles/defaultModelConfig/CNN/faster_rcnn/faster_rcnn_convnext.py"
        swint: "engines/mmdet_run/myfiles/defaultModelConfig/CNN/faster_rcnn/faster_rcnn_swint.py"
      cascade-rcnn:
        resnet: "engines/mmdet_run/myfiles/defaultModelConfig/CNN/cascade_rcnn/cascade_rcnn_resnet.py"
        convnext: "engines/mmdet_run/myfiles/defaultModelConfig/CNN/cascade_rcnn/cascade_rcnn_convnext.py"
        swint: "engines/mmdet_run/myfiles/defaultModelConfig/CNN/cascade_rcnn/cascade_rcnn_swint.py"
      detectors:
        resnet: "engines/mmdet_run/myfiles/defaultModelConfig/CNN/detectors/detectors_resnet.py"
      detr:
        resnet: "engines/mmdet_run/myfiles/defaultModelConfig/DETR/detr/detr_r50_8xb2-150e_coco.py"
        swint: "engines/mmdet_run/myfiles/defaultModelConfig/DETR/detr/detr_swin_8xb2-150e_coco.py"
      dino:
        resnet: "engines/mmdet_run/myfiles/defaultModelConfig/DETR/dino/dino-4scale_r50_8xb2-12e_coco.py"
        swint: "engines/mmdet_run/myfiles/defaultModelConfig/DETR/dino/dino-5scale_swin-l_8xb2-12e_coco.py"
      deformable-detr:
        resnet: "engines/mmdet_run/myfiles/defaultModelConfig/DETR/deformable_detr/deformable-detr_r50_16xb2-50e_coco.py"
        swint: "engines/mmdet_run/myfiles/defaultModelConfig/DETR/deformable_detr/deformable-detr_swin_16xb2-50e_coco.py"
    local-data-path: "engines/mmdet_run/myfiles/defaultModelConfig/dataset.py"
    local-train-path: "engines/mmdet_run/myfiles/defaultModelConfig/schedule.py"
    local-runtime-path: "engines/mmdet_run/myfiles/defaultModelConfig/default_runtime.py"
  instancecfg:
    instancedata-mid-root: "${INSTANCE_DATA_MID_ROOT:data/instance_dataset_mid/}"  # 中间实例数据集根目录
    script-storage-dir: "${INSTANCE_SCRIPT_DIR:data/preprocess_scripts/}"
    instancedata-root: "${INSTANCE_DATA_ROOT:data/instance_dataset/}"  # 实例数据集根目录
    python-path: "${INSTANCE_PYTHON_PATH:/home/omen1/miniconda3/envs/platform/bin/python}"  # Python 解释器路径

  runner:
    train-url: "${RUNNER_TRAIN_URL:http://127.0.0.1:8009/api/runner/train}"
    # 是否在启动 Spring Boot 时自动拉起 MMDet Runner（子进程）。默认 true，避免本地再手动执行 start_runner.sh。
    # 生产若由 Docker/systemd 单独托管 Runner，请设置 RUNNER_AUTO_START=false。
    auto-start: ${RUNNER_AUTO_START:true}
    # 停止后端时是否同时结束本进程拉起的 Runner（默认 false，避免 IDE 点 Stop 后 8009 被关掉）
    auto-stop-on-shutdown: ${RUNNER_AUTO_STOP_ON_SHUTDOWN:false}
    launch-script: "${RUNNER_LAUNCH_SCRIPT:engines/mmdet_run/mmdet_runner_srv/start_runner.sh}"
    auto-start-log: "${RUNNER_AUTO_START_LOG:engines/mmdet_run/logs/runner-autostart.log}"





app:
  flyway:
    enabled: false          # 总开关：false 时 DatabaseInit 将跳过 Flyway（等同不用）
    mode: migrate           # 取值：migrate / repair / disable（当 enabled=false 时此项被忽略）
    out-of-order: false     # 若需要执行乱序版本（如保留了 V48..V52 且已存在 V53），改为 true
    locations: classpath:db/migration  # 迁移脚本目录
